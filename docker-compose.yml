services:
  license-manager:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8081
      TCP_PORT: 7443
      DATABASE_HOST: ${DATABASE_HOST:-host.docker.internal}
      DATABASE_PORT: ${DATABASE_PORT:-3306}
      DATABASE_USER: root
      DATABASE_PASSWORD_FILE: /run/secrets/mysql_password
      DATABASE_NAME: ${DATABASE_NAME:-license_manager}
      DATABASE_ALLOW_PUBLIC_KEY_RETRIEVAL: ${DATABASE_ALLOW_PUBLIC_KEY_RETRIEVAL:-true}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:8081}
      JWT_ISSUER: ${JWT_ISSUER:-secure-license-manager}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-licensed-app}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET in .env}
      ADMIN_SESSION_MINUTES: ${ADMIN_SESSION_MINUTES:-480}
      HWID_PEPPER: ${HWID_PEPPER:?Set HWID_PEPPER in .env}
      LICENSE_PRIVATE_KEY_PATH: /app/certs/dev/license-ed25519-private.pem
      LICENSE_PUBLIC_KEY_PATH: /app/certs/dev/license-ed25519-public.pem
      TLS_KEY_PATH: /app/certs/dev/server-key.pem
      TLS_CERT_PATH: /app/certs/dev/server-cert.pem
      TLS_CA_PATH: /app/certs/dev/ca-cert.pem
      TLS_REQUIRE_CLIENT_CERT: ${TLS_REQUIRE_CLIENT_CERT:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set a strong BOOTSTRAP_ADMIN_PASSWORD in .env}
      BOOTSTRAP_ALLOW_WEAK_PASSWORD: "false"
    ports:
      - "${PORT:-8081}:8081"
      - "${TCP_PORT:-7443}:7443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./certs:/app/certs:ro
    secrets:
      - mysql_password
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

secrets:
  mysql_password:
    file: ./secrets/mysql_password.txt
