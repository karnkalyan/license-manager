<style>
:root{--ink:#172033;--muted:#64748b;--line:#d9e2ec;--panel:#f7f9fc;--accent:#4f46e5;--good:#047857;--warn:#b45309}
*{box-sizing:border-box}html{font-size:14px}body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;max-width:980px;margin:0 auto;padding:38px 46px 70px;color:var(--ink);line-height:1.6;background:#fff}h1{font-size:24px;line-height:1.22;margin:30px 0 12px;letter-spacing:-.02em}h2{font-size:17px;margin:27px 0 9px;border-bottom:1px solid var(--line);padding-bottom:6px}h3{font-size:14px;margin:22px 0 7px}h4{font-size:13px;margin:18px 0 6px}p,li{font-size:12.5px}a{color:var(--accent);text-decoration:none}blockquote{margin:14px 0;padding:10px 14px;border-left:3px solid var(--accent);background:#f5f6ff;color:#39445a;border-radius:0 8px 8px 0}blockquote p{margin:2px 0}code{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:10.5px;background:#f1f5f9;padding:1px 4px;border-radius:4px}pre{background:#111827;color:#e5e7eb;padding:13px 15px;border-radius:9px;overflow:auto;border:1px solid #1f2937;line-height:1.48}pre code{background:transparent;color:inherit;padding:0;font-size:10px}table{width:100%;border-collapse:collapse;margin:12px 0 18px;font-size:11px}th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}th{background:var(--panel);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#475569}ul,ol{padding-left:20px}hr{border:0;border-top:1px solid var(--line);margin:26px 0}#TOC{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:20px 0 28px}#TOC ul{margin:4px 0}#TOC a{font-size:11.5px}.title{font-size:26px;margin-bottom:5px}.subtitle{font-size:14px;color:var(--muted);font-weight:500;margin-top:0}.date{font-size:11px;color:var(--muted)}.section-break{height:1px}.section-break+ h1{margin-top:34px}.sourceCode{break-inside:avoid}.header-section-number{color:var(--accent)}

</style>
